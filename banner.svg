<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2045"/>
      <stop offset="100%" stop-color="#1B3F8A"/>
    </linearGradient>
    <linearGradient id="pyrGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#FFD700" opacity="0.7">
    <circle cx="40"  cy="20"  r="1.2"/>
    <circle cx="90"  cy="45"  r="0.9"/>
    <circle cx="160" cy="15"  r="1.4"/>
    <circle cx="230" cy="35"  r="0.8"/>
    <circle cx="310" cy="12"  r="1.1"/>
    <circle cx="390" cy="40"  r="0.9"/>
    <circle cx="460" cy="18"  r="1.3"/>
    <circle cx="530" cy="32"  r="0.8"/>
    <circle cx="600" cy="10"  r="1.2"/>
    <circle cx="670" cy="28"  r="1.0"/>
    <circle cx="700" cy="55"  r="0.7"/>
    <circle cx="70"  cy="70"  r="0.6"/>
    <circle cx="200" cy="60"  r="0.8"/>
    <circle cx="680" cy="70"  r="0.9"/>
  </g>

  <!-- Apex glow -->
  <ellipse cx="120" cy="85" rx="40" ry="20" fill="url(#glow)"/>

  <!-- Pyramid -->
  <polygon points="120,85 60,165 180,165" fill="url(#pyrGrad)"/>
  <!-- Left face shadow -->
  <polygon points="120,85 60,165 120,165" fill="#5a4000" opacity="0.35"/>
  <!-- Ground line -->
  <line x1="40" y1="165" x2="200" y2="165" stroke="#C9A227" stroke-width="1.5" opacity="0.5"/>

  <!-- Hieroglyphic decoration row -->
  <text x="240" y="72" font-family="serif" font-size="22" fill="#C9A227" opacity="0.55" letter-spacing="6">𓏤 𓎆 𓍢 𓆼 𓂭 𓆐</text>

  <!-- Title -->
  <text x="240" y="115" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#FFD700" letter-spacing="2">Temple of Numbers</text>

  <!-- Subtitle -->
  <text x="242" y="145" font-family="Georgia, serif" font-size="16" fill="#EDE3C0" opacity="0.85" letter-spacing="1">Ancient Egyptian Mathematics · Interactive Learning</text>

  <!-- Bottom accent line -->
  <line x1="240" y1="160" x2="680" y2="160" stroke="#2ABFBF" stroke-width="1.5" opacity="0.6"/>
  <line x1="240" y1="163" x2="680" y2="163" stroke="#C9A227" stroke-width="0.5" opacity="0.4"/>
</svg>
